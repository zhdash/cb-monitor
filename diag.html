<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>可转债监控 · 直连自检</title>
<style>
:root{--bg:#f7f8fa;--card:#fff;--ink:#1f2328;--ink2:#4a5158;--ink3:#7a838c;
 --line:#e3e6ea;--ok:#1a7f5a;--bad:#c0392b;--warn:#b45309;--blue:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--ink);
 font:15px/1.7 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:21px;margin:0 0 4px}
h2{font-size:14px;margin:18px 0 6px;color:var(--ink3);font-weight:600}
.sub{color:var(--ink3);font-size:13px;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;
 padding:14px 16px;margin-bottom:12px}
.env{font:12.5px/1.8 "Cascadia Mono",Consolas,monospace;color:var(--ink2);word-break:break-all}
.row{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.badge{flex:none;width:62px;text-align:center;border-radius:6px;padding:2px 0;
 font-size:12px;font-weight:700;color:#fff;background:var(--ink3)}
.badge.ok{background:var(--ok)} .badge.bad{background:var(--bad)} .badge.warn{background:var(--warn)}
.name{flex:none;width:300px;font-size:13.5px;font-weight:600}
.det{flex:1;font:12.5px/1.7 "Cascadia Mono",Consolas,monospace;color:var(--ink2);word-break:break-all}
.det .e{color:var(--bad)}
.big{font-size:13.5px;color:var(--ink2);background:#fbfbfc;border:1px solid var(--line);
 border-radius:8px;padding:12px 14px;margin-top:10px;line-height:1.9}
button{margin-top:12px;padding:7px 16px;border-radius:8px;border:1px solid var(--line);
 background:#fff;font-size:13.5px;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
<h1>直连自检</h1>
<div class="sub">逐项测试浏览器能否直接拿到数据源。绿色 = 通过，红色 = 失败（失败原因会写出来）。<b>直接整页截图即可。</b></div>

<div class="card">
  <div class="env" id="env">读取环境…</div>
</div>

<div class="card">
  <h2 style="margin-top:0">① 基础能力</h2>
  <div id="rows1"></div>
</div>

<div class="card">
  <h2 style="margin-top:0">② 腾讯 qt.gtimg.cn —— 行情（本页当前失败的就是它）</h2>
  <div id="rows2"></div>
</div>

<div class="card">
  <h2 style="margin-top:0">③ 其它数据源</h2>
  <div id="rows3"></div>
</div>

<div class="card">
  <div class="big" id="verdict">检测中…</div>
  <button id="copyBtn">复制结果</button>
</div>
</div>

<script>
const $ = s => document.querySelector(s);
const QC = 'https://qt.gtimg.cn/q=sh113709';
const KC = 'https://ifzq.gtimg.cn/appstock/app/kline/mkline?param=sh113709,m5,,8';
const LC = 'https://datacenter-web.eastmoney.com/api/data/v1/get?reportName=RPT_BOND_CB_LIST&columns=SECURITY_CODE,CONVERT_STOCK_CODE&pageSize=2&source=WEB&client=WEB&pageNumber=1';
const PC = 'https://push2.eastmoney.com/api/qt/ulist.np/get?fltt=2&fields=f12,f235,f236,f237&secids=1.113709';

const results = [];
const R = {};

$('#env').textContent =
  'location.href    = ' + location.href + '\n' +
  'location.origin  = ' + location.origin + '\n' +
  'hostname / port  = ' + location.hostname + ' / ' + (location.port || '(默认)') + '\n' +
  '判定 USE_BACKEND = ' + (/^(127\.0\.0\.1|localhost)$/.test(location.hostname) && location.port === '8011')
  + '   （false → 走浏览器直连，正是要测的）\n' +
  'UA               = ' + navigator.userAgent;

function row(box, name, state, detail) {
  const d = document.createElement('div');
  d.className = 'row';
  const b = document.createElement('span');
  b.className = 'badge ' + state;
  b.textContent = (state === 'ok' ? '通过' : state === 'bad' ? '失败' : '注意');
  const n = document.createElement('span');
  n.className = 'name';
  n.textContent = name;                       // 用 textContent：否则名字里的 <script> 会被当标签吞掉
  const t = document.createElement('span');
  t.className = 'det';
  t.innerHTML = detail;
  d.appendChild(b); d.appendChild(n); d.appendChild(t);
  box.appendChild(d);
}

async function t(box, key, name, fn) {
  try {
    const r = await fn();
    R[key] = 'ok';
    row(box, name, 'ok', r);
    results.push([name, 'ok', String(r).replace(/<[^>]+>/g, '')]);
  } catch (e) {
    R[key] = 'bad';
    const nm = (e && e.name) || 'Error';
    const msg = (e && e.message) || String(e);
    row(box, name, 'bad', '<span class="e">' + nm + '</span>: ' + msg);
    results.push([name, 'bad', nm + ': ' + msg]);
  }
}

const b1 = $('#rows1'), b2 = $('#rows2'), b3 = $('#rows3');

(async () => {
  // ===== ① 基础能力 =====
  await t(b1, 'same', '同源 fetch（cb_list.json）', async () => {
    const r = await fetch('cb_list.json');
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    const n = (j.list || []).length;
    if (!n) throw new Error('返回了 JSON 但没有 list');
    return 'HTTP ' + r.status + ' ｜ ' + n + ' 只 ｜ 说明 fetch 本身可用';
  });

  await t(b1, 'gbk', 'TextDecoder(gbk) 可用性', async () => {
    const s = new TextDecoder('gbk').decode(new Uint8Array([0xd5, 0xf1, 0x32, 0x36]));
    if (s !== '振26') throw new Error('解码结果异常：' + s);
    return '正常，解码为「' + s + '」（中文名不乱码）';
  });

  // ===== ② 腾讯 qt.gtimg.cn —— 关键判别组 =====
  await t(b2, 'plain', '普通 fetch（简单请求，无任何选项）', async () => {
    const r = await fetch(QC);
    const b = await r.arrayBuffer();
    if (b.byteLength < 50) throw new Error('返回内容过短（' + b.byteLength + ' 字节）');
    return 'HTTP ' + r.status + ' ｜ ' + b.byteLength + ' 字节 ｜ ' +
           new TextDecoder('gbk').decode(b).slice(0, 50);
  });

  await t(b2, 'nocors', 'no-cors fetch（★ 判别：网络 vs 跨域）', async () => {
    const r = await fetch(QC, { mode: 'no-cors' });
    return '请求发出成功（opaque 响应，status=' + r.status + '）—— 说明【网络通】，问题只在跨域';
  });

  // 批量尺寸梯度：单只正常、80 只一批全挂 → 差异只在【URL 长度 / 逗号个数】
  let cbSyms = null;
  try {
    const j = await (await fetch('cb_list.json')).json();
    cbSyms = (j.list || []).map(x => (String(x[0]).startsWith('12') ? 'sz' : 'sh') + x[0]);
  } catch (e) { cbSyms = null; }
  for (const n of [1, 3, 10, 40, 80]) {
    await t(b2, 'batch' + n, '批量 ' + n + ' 只（应用用的是 80）', async () => {
      if (!cbSyms || cbSyms.length < n) throw new Error('本地 cb_list.json 不足，无法构造 ' + n + ' 只');
      const url = 'https://qt.gtimg.cn/q=' + cbSyms.slice(0, n).join(',');
      const r = await fetch(url);
      const buf = await r.arrayBuffer();
      const got = (new TextDecoder('gbk').decode(buf).match(/v_[a-z]{2}\d{6}="/g) || []).length;
      if (!got) throw new Error('返回 ' + buf.byteLength + ' 字节但没有行情数据');
      return 'HTTP ' + r.status + ' ｜ ' + buf.byteLength + ' 字节 ｜ 解析到 ' + got + ' 只 ｜ URL ' + url.length + ' 字符';
    });
  }

  await t(b2, 'script', '<script> 加载（不走 CORS + 能否直接取数）', () => new Promise((res, rej) => {
    const s = document.createElement('script');
    const tm = setTimeout(() => rej(new Error('超时（6s）')), 6000);
    s.onload = () => {
      clearTimeout(tm);
      const v = window.v_sh113709;
      if (v) res('加载成功且取到数据 —— 『' + String(v).slice(0, 46) + '…』（★ 可用这个方式绕过 fetch）');
      else res('加载成功但没拿到 v_sh113709 变量');
    };
    s.onerror = () => { clearTimeout(tm); rej(new Error('加载失败 —— 被拦在连接层')); };
    s.src = QC + '&_=' + Date.now();
    document.head.appendChild(s);
  }));

  await t(b2, 'nostore', '带 cache:no-store（对照：验证预检猜测）', async () => {
    const r = await fetch(QC, { cache: 'no-store' });
    return 'HTTP ' + r.status + ' ｜ ' + (await r.arrayBuffer()).byteLength + ' 字节（带选项也能通）';
  });

  await t(b2, 'noref', '带 referrerPolicy:no-referrer（排查 Referer）', async () => {
    const r = await fetch(QC, { referrerPolicy: 'no-referrer' });
    return 'HTTP ' + r.status + ' ｜ ' + (await r.arrayBuffer()).byteLength + ' 字节';
  });

  // ===== ③ 其它数据源 =====
  await t(b3, 'kline', '腾讯 5 分钟 K 线 ifzq.gtimg.cn', async () => {
    const r = await fetch(KC);
    const j = await r.json();
    const n = (((j.data || {})['sh113709'] || {}).m5 || []).length;
    if (!n) throw new Error('返回了 JSON 但没有 m5 数据');
    return 'HTTP ' + r.status + ' ｜ m5 根数 ' + n;
  });

  await t(b3, 'list', '东财可转债清单 datacenter-web', async () => {
    const r = await fetch(LC);
    const j = await r.json();
    const n = ((j.result || {}).data || []).length;
    if (!n) throw new Error('返回了 JSON 但没有数据');
    return 'HTTP ' + r.status + ' ｜ 条数 ' + n + ' ｜ 总数 ' + (j.result || {}).count;
  });

  await t(b3, 'prem', '东财溢价率 push2', async () => {
    const r = await fetch(PC);
    const j = await r.json();
    const d = ((j.data || {}).diff) || [];
    if (!d.length) throw new Error('返回了 JSON 但没有 diff 数据');
    return 'HTTP ' + r.status + ' ｜ ' + JSON.stringify(d[0]).slice(0, 70);
  });

  // ===== 结论 =====
  const okCount = results.filter(r => r[1] === 'ok').length;
  const v = $('#verdict');
  const netOK = (R.nocors === 'ok') || (R.script === 'ok');
  const smallOK = (R.batch1 === 'ok') || (R.batch3 === 'ok') || (R.batch10 === 'ok');
  const bigBad = (R.batch40 === 'bad') || (R.batch80 === 'bad');
  let html = '<b>通过 ' + okCount + '/' + results.length + '</b>';

  if (!results.filter(r => r[1] === 'bad').length) {
    html += '<br><b style="color:var(--ok)">全部通过</b> —— 浏览器直连数据源没问题；若监控页仍无数据，把监控页截图发我。';
  } else if (smallOK && bigBad) {
    html += '<br><b style="color:var(--warn)">判断：小批量能过、大批量过不去</b><br>' +
      '⇒ 不是跨域、也不是域名被拦，而是 <b>URL 太长 / 逗号太多</b>（中间某层限长）。<br>' +
      '监控页（v1.2.3 起）已改成<b>自适应拆分</b>：大批量失败会自动对半拆开重试，并记住可用批量。' +
      '刷新监控页即可。';
  } else if (R.plain === 'bad' && !netOK) {
    html += '<br><b style="color:var(--bad)">判断：腾讯 qt.gtimg.cn 在你浏览器里被【整层拦截】</b><br>' +
      '普通 fetch、no-cors、&lt;script&gt; <b>多种通道全部失败</b> ⇒ 不是跨域问题，' +
      '是请求根本没发出去 / 被中途掐断。<br>' +
      '<b>最可能：内容拦截扩展或代理规则把 gtimg.cn 拦了。</b><br>' +
      '→ 请用 <b>InPrivate 窗口</b>（默认禁用所有扩展）打开监控页对比；'
      + '或在 uBlock 图标里把本页加白名单。';
  } else if (R.plain === 'bad' && netOK) {
    html += '<br><b style="color:var(--warn)">判断：腾讯域名【网络是通的】，只是 fetch 被跨域挡住</b><br>' +
      '监控页（v1.2.2 起）已内置 <b>&lt;script&gt; 通道</b>自动兜底，刷新监控页即可。';
  } else if (R.plain === 'ok' && R.kline === 'bad') {
    html += '<br><b style="color:var(--warn)">行情能拿，但 K 线拿不到</b> —— 把本页截图发我。';
  } else {
    html += '<br><b style="color:var(--warn)">有部分失败</b>，失败项：' +
      results.filter(r => r[1] === 'bad').map(r => r[0]).join('、') + '<br>把本页截图发我。';
  }
  v.innerHTML = html;
})();

$('#copyBtn').onclick = () => {
  const txt = '=== 直连自检结果 ===\n' + $('#env').textContent + '\n\n' +
    results.map(r => '[' + r[1] + '] ' + r[0] + ' → ' + r[2]).join('\n');
  navigator.clipboard.writeText(txt).then(
    () => { $('#copyBtn').textContent = '已复制 ✓'; },
    () => { $('#copyBtn').textContent = '复制失败，请手动截图'; });
};
</script>
</body>
</html>
